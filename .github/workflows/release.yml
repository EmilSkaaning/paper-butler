name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Dry-run: Generate the changelog and stop, without committing/tagging/publishing"
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version in pyproject.toml
        id: bump
        run: |
          current=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major)
              major=$((major + 1)); minor=0; patch=0
              ;;
            minor)
              minor=$((minor + 1)); patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          new_version="${major}.${minor}.${patch}"
          sed -i "0,/^version = \".*\"/s//version = \"${new_version}\"/" pyproject.toml
          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          echo "branch=release/v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4.8.0
        id: cliff-full
        with:
          config: cliff.toml
          args: --tag ${{ steps.bump.outputs.tag }} --output CHANGELOG.md

      - name: Upload changelog artifact (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: CHANGELOG
          path: CHANGELOG.md

      - name: Commit release
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.bump.outputs.branch }}"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore: release ${{ steps.bump.outputs.tag }}"

      - name: Push branch
        if: ${{ !inputs.dry_run }}
        run: |
          git push origin "${{ steps.bump.outputs.branch }}"

      - name: Open PR to land release commit on main
        if: ${{ !inputs.dry_run }}
        env:
          # The default GITHUB_TOKEN doesn't trigger workflow runs on PRs it
          # opens, so required status checks on main never fire. RELEASE_PAT
          # (a PAT or GitHub App token with contents+pull-requests write) must
          # be added as a repo secret for auto-merge to actually complete.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          pr_url=$(gh pr create \
            --base main \
            --head "${{ steps.bump.outputs.branch }}" \
            --title "chore: release ${{ steps.bump.outputs.tag }}" \
            --body "Automated version bump and changelog for ${{ steps.bump.outputs.tag }}. Merging this PR triggers the Publish Release workflow, which tags the release commit and publishes the GitHub Release.")
          gh pr merge "$pr_url" --merge --auto
